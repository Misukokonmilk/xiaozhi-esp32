## IDF Component Manager Manifest File
## EchoEar (miaoban) only — all other board dependencies removed
dependencies:
  # Display
  espressif/esp_lcd_st77916: ^1.0.1
  espressif/esp_lcd_panel_io_additions: ^1.0.1

  # Touch
  espressif/esp_lcd_touch_cst816s: ^1.0.6

  # Network
  78/esp-wifi-connect: ~2.5.2
  78/esp-ml307: ~3.3.5  # Required for NetworkInterface, Http, WebSocket base classes

  # Audio
  78/esp-opus-encoder: ~2.4.1
  espressif/esp_codec_dev: ~1.4.0
  espressif/esp-sr: ~2.1.5

  # Fonts & Assets
  78/xiaozhi-fonts: ~1.5.3
  espressif/esp_mmap_assets: '>=1.2'

  # UI Framework
  lvgl/lvgl: ~9.3.0
  esp_lvgl_port: ~2.6.0
  espressif2022/esp_emote_gfx: ^1.1.0

  # Input
  espressif/button: ~4.1.3

  # Battery
  espressif/adc_battery_estimation: ^0.2.1

  ## Required IDF version
  idf:
    version: '>=5.4.0'
